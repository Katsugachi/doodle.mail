<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>doodle.mail transport harness</title>
  <script src="../vendor/peerjs.min.js"></script>
</head>
<body>
  <script type="module">
    import { openDB } from '../js/db.js';
    import { fingerprint, generateIdentity, signEnvelope } from '../js/crypto.js';
    import {
      PEER_PREFIX,
      checkAvailability,
      createTransport,
    } from '../js/net.js';

    const ICE_SERVERS = [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:global.stun.twilio.com:3478' },
    ];
    const delay = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));
    let db;
    let identity;
    let transport;
    let address;
    window.received = [];
    window.deliveries = [];
    window.retryNowCalls = 0;

    window.setupMailbox = async handle => {
      transport?.stop();
      db?.close();
      address = handle;
      db = await openDB(handle);
      identity = await db.kv.get('identity');
      if (!identity) {
        identity = await generateIdentity();
        await db.kv.set('identity', identity);
      }
      window.received = [];
      window.deliveries = [];
      transport = createTransport({
        address: handle,
        name: handle,
        identity,
        outbox: db.outbox,
        getBlob: id => db.blobs.get(id),
        knownKeys: {
          get: async sender => db.kv.get(`key:${sender}`),
          set: async (sender, key) => db.kv.set(`key:${sender}`, key),
        },
        onStatus: (status, detail) => {
          window.status = status;
          window.statusDetail = detail?.message || '';
        },
        onMessage: async (envelope, meta) => {
          const attachmentHashes = await Promise.all(envelope.attachments.map(async attachment => {
            const hash = await crypto.subtle.digest('SHA-256', attachment.data);
            return Array.from(new Uint8Array(hash), byte => byte.toString(16).padStart(2, '0')).join('');
          }));
          window.received.push({
            mid: envelope.mid,
            from: envelope.from.address,
            subject: envelope.subject,
            meta,
            attachmentHashes,
          });
        },
        onDelivery: (item, state, info) => {
          window.deliveries.push({
            id: item.id,
            mid: item.mid,
            state,
            nextAttempt: info?.nextAttempt,
            error: info?.error,
          });
        },
      });
      await transport.start();
      return { status: transport.status, fingerprint: await fingerprint(identity.publicJwk) };
    };

    window.enqueueMail = async (recipient, options = {}) => {
      const mid = options.mid || `${address}-${crypto.randomUUID()}`;
      const attachments = options.attachments || [];
      const envelope = {
        v: 1,
        type: 'mail',
        mid,
        threadId: options.threadId || mid,
        inReplyTo: null,
        from: { address, name: address },
        to: [recipient],
        cc: [],
        subject: options.subject || `test ${mid}`,
        text: options.text || 'transport test',
        date: new Date().toISOString(),
        attachments,
      };
      await transport.enqueue({
        id: mid,
        mid,
        recipient,
        envelope,
        createdAt: Date.now(),
        attempts: 0,
        nextAttempt: 0,
        lastError: '',
      });
      return mid;
    };

    window.addBlob = async (id, size) => {
      const bytes = new Uint8Array(size);
      for (let index = 0; index < bytes.length; index += 1) bytes[index] = (index * 31 + 17) & 0xff;
      const blob = new Blob([bytes], { type: 'application/octet-stream' });
      await db.blobs.put(id, blob);
      const digest = await crypto.subtle.digest('SHA-256', await blob.arrayBuffer());
      return Array.from(new Uint8Array(digest), byte => byte.toString(16).padStart(2, '0')).join('');
    };

    window.seedQueuedMail = async (recipient, nextAttempt = 0) => {
      const mid = `${address}-seed-${crypto.randomUUID()}`;
      const envelope = {
        v: 1,
        type: 'mail',
        mid,
        threadId: mid,
        inReplyTo: null,
        from: { address, name: address },
        to: [recipient],
        cc: [],
        subject: `seed ${mid}`,
        text: 'seeded outbox item',
        date: new Date().toISOString(),
        attachments: [],
      };
      await db.outbox.put({
        id: mid,
        mid,
        recipient,
        envelope,
        createdAt: Date.now(),
        attempts: 0,
        nextAttempt,
        lastError: '',
      });
      return mid;
    };

    window.deferOutboxItem = async (mid, milliseconds) => {
      const item = await db.outbox.get(mid);
      item.nextAttempt = Date.now() + milliseconds;
      await db.outbox.put(item);
    };

    window.outboxItems = () => db.outbox.all();
    window.checkAddress = addressToCheck => checkAvailability(addressToCheck);
    window.flushNow = () => {
      window.retryNowCalls += 1;
      return transport.retryNow();
    };
    window.stopMailbox = () => transport?.stop();

    window.injectTamperedSignature = async recipient => {
      transport.stop();
      await delay(1_500);
      const Peer = globalThis.peerjs.Peer;
      const rawPeer = new Peer(`${PEER_PREFIX}${address}`, { config: { iceServers: ICE_SERVERS } });
      try {
        await new Promise((resolve, reject) => {
          const timeout = setTimeout(() => reject(new Error('Raw peer open timeout')), 15_000);
          rawPeer.on('open', () => {
            clearTimeout(timeout);
            resolve();
          });
          rawPeer.on('error', error => {
            clearTimeout(timeout);
            reject(error);
          });
        });
        const mid = `${address}-tampered-${crypto.randomUUID()}`;
        const envelope = {
          v: 1,
          type: 'mail',
          mid,
          threadId: mid,
          inReplyTo: null,
          from: { address, name: address },
          to: [recipient],
          cc: [],
          subject: 'original content',
          text: 'tampered signature test',
          date: new Date().toISOString(),
          attachments: [],
        };
        const sig = await signEnvelope(identity.privateJwk, envelope);
        envelope.subject = 'changed after signing';
        const conn = rawPeer.connect(`${PEER_PREFIX}${recipient}`, {
          serialization: 'binary',
          reliable: true,
        });
        await new Promise((resolve, reject) => {
          const timeout = setTimeout(() => reject(new Error('Tamper connection timeout')), 15_000);
          conn.on('open', () => {
            clearTimeout(timeout);
            resolve();
          });
          conn.on('error', error => {
            clearTimeout(timeout);
            reject(error);
          });
        });
        const acknowledgement = new Promise((resolve, reject) => {
          const timeout = setTimeout(() => reject(new Error('Tamper ack timeout')), 15_000);
          conn.on('data', packet => {
            if (packet.kind === 'ack' && packet.mid === mid) {
              clearTimeout(timeout);
              resolve(packet);
            }
          });
        });
        conn.send({ kind: 'mail', envelope, sig, pub: identity.publicJwk });
        await acknowledgement;
        conn.close();
        return mid;
      } finally {
        rawPeer.destroy();
        await delay(1_000);
        transport.start();
      }
    };

    window.addEventListener('beforeunload', () => transport?.stop());
    window.harnessReady = true;
  </script>
</body>
</html>
