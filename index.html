<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self' https: wss:; frame-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="doodle.mail - peer-to-peer notebook mail over WebRTC. Your messages live in your browser.">
  <title>doodle.mail</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/patrick-hand-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css?v=3">
  <script src="js/theme-boot.js"></script>
  <script src="vendor/peerjs.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="root" class="boot">
    <div class="boot-msg">opening your notebook…</div>
  </div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <div id="print-root" class="print-root" aria-hidden="true"></div>
  <noscript><p class="noscript">doodle.mail needs JavaScript to run (everything happens in your browser).</p></noscript>
</body>
</html>
