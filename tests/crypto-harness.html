<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>doodle.mail crypto harness</title>
</head>
<body>
  <script type="module">
    import {
      canonicalize,
      fingerprint,
      generateIdentity,
      signEnvelope,
      verifyEnvelope,
    } from '../js/crypto.js';

    window.cryptoTests = async () => {
      const identity = await generateIdentity();
      const envelope = {
        v: 1,
        type: 'mail',
        mid: 'crypto-test',
        attachments: [{
          id: 'blob',
          name: 'one.bin',
          type: 'application/octet-stream',
          size: 4,
          data: new Uint8Array([1, 2, 3, 4]).buffer,
        }],
      };
      const signature = await signEnvelope(identity.privateJwk, envelope);
      const roundtrip = await verifyEnvelope(identity.publicJwk, envelope, signature);
      const tampered = await verifyEnvelope(identity.publicJwk, { ...envelope, text: 'changed' }, signature);
      const canonicalOrderIndependent = canonicalize({ z: 1, a: { y: 2, x: 3 } })
        === canonicalize({ a: { x: 3, y: 2 }, z: 1 });
      return {
        roundtrip,
        tampered,
        canonicalOrderIndependent,
        fingerprint: await fingerprint(identity.publicJwk),
      };
    };
    window.harnessReady = true;
  </script>
</body>
</html>
